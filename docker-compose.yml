version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_light_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ENV=development
      - HOST=0.0.0.0
      - PORT=5000
      - SECRET_KEY=dev-secret-key-change-me
      - API_KEY=hello-from-pi-lets-make-it-work
      - CORS_ALLOW_ORIGINS=http://localhost:5000,http://localhost:5173,http://127.0.0.1:5000,http://127.0.0.1:5173
    volumes:
      # Persist SQLite database and media across restarts
      - ./backend/storage:/app/backend/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_light_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Mount frontend code for live hot-module reload during development
      - ./frontend:/app
      # Prevent host's node_modules from overwriting container's node_modules
      - /app/node_modules

